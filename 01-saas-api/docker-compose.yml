services:
  # 1. SaaS API Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: saas-api
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
      - PORT=4000
      - LOG_LEVEL=info
      - CORS_ORIGIN=http://localhost:3000
      - DATABASE_URL=${DATABASE_URL}
      - DATABASE_POOL_MIN=2
      - DATABASE_POOL_MAX=10
      - REDIS_URL=redis://redis:6379
      - JWT_ACCESS_PRIVATE_KEY=${JWT_ACCESS_PRIVATE_KEY}
      - JWT_ACCESS_PUBLIC_KEY=${JWT_ACCESS_PUBLIC_KEY}
      - JWT_ACCESS_EXPIRES_IN=15m
      - JWT_REFRESH_EXPIRES_IN_DAYS=30
      - OTEL_TRACING_ENABLED=true
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://tempo:4318/v1/traces
    depends_on:
      redis:
        condition: service_healthy
      tempo:
        condition: service_started
    networks:
      - saas-network

  # Dedicated Background Worker (Processes BullMQ notifications & webhooks)
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: saas-worker
    restart: unless-stopped
    command: ["node", "dist/jobs/worker.js"]
    environment:
      - NODE_ENV=production
      - LOG_LEVEL=info
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=redis://redis:6379
      - OTEL_TRACING_ENABLED=true
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://tempo:4318/v1/traces
    depends_on:
      redis:
        condition: service_healthy
      tempo:
        condition: service_started
    networks:
      - saas-network

  # 2. Redis In-Memory Cache & Rate Limiter
  redis:
    image: redis:7-alpine
    container_name: saas-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - saas-network

  # 3. Prometheus Metrics Scraper & Time-Series Engine
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: saas-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    networks:
      - saas-network

  # 4. Grafana Tempo Distributed Tracing Storage
  tempo:
    image: grafana/tempo:2.6.0
    container_name: saas-tempo
    restart: unless-stopped
    ports:
      - "3200:3200" # Tempo HTTP query
      - "4318:4318" # OTLP HTTP receiver (used by OpenTelemetry Node SDK)
      - "4317:4317" # OTLP gRPC receiver
    volumes:
      - ./docker/tempo/tempo.yml:/etc/tempo.yaml:ro
    command: ["-config.file=/etc/tempo.yaml"]
    networks:
      - saas-network

  # 5. Grafana Loki Log Aggregator
  loki:
    image: grafana/loki:3.1.1
    container_name: saas-loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    volumes:
      - ./docker/loki/loki.yml:/etc/loki/local-config.yaml:ro
    command: ["-config.file=/etc/loki/local-config.yaml"]
    networks:
      - saas-network

  # 6. Grafana Unified Visualization Dashboard
  grafana:
    image: grafana/grafana:11.2.0
    container_name: saas-grafana
    restart: unless-stopped
    ports:
      - "3001:3000" # Mapped to 3001 on host to avoid local dev server collisions
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./docker/grafana/provisioning/datasources/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yaml:ro
    depends_on:
      - prometheus
      - tempo
      - loki
    networks:
      - saas-network

networks:
  saas-network:
    driver: bridge
