global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: "saas-api"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["app:4000"]
        labels:
          service: "saas-api"
          environment: "production"

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
